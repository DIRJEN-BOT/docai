[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docai"
version = "0.1.0"
description = "Indonesian bank e-statement parser — extract structured transaction data from BCA/Mandiri/BNI/BRI PDFs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["bca", "e-statement", "bank", "indonesia", "parser", "mutasi", "rekening koran"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pypdf>=3.0",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
server = [
    "uvicorn>=0.29",
]
dev = [
    "pytest>=7.0",
    "fpdf2>=2.7",
    "httpx>=0.27",
    "pdfplumber>=0.9",
    "uvicorn>=0.29",
]

[project.scripts]
docai = "docai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
