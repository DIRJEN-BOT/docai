name: Daily Smoke Test

on:
  schedule:
    - cron: '0 8 * * *'  # 8 AM UTC daily
  workflow_dispatch:  # Allow manual trigger

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://docaiid.pythonanywhere.com/health")
          echo "Health: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Parse BCA
        run: |
          # Download demo PDF from the repo
          curl -sL "https://raw.githubusercontent.com/DIRJEN-BOT/docai/main/fixtures/demo_bca_statement.pdf" -o /tmp/bca.pdf
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "https://docaiid.pythonanywhere.com/parse" \
            -H "X-API-Key: docai-dev-key-12345" \
            -F "file=@/tmp/bca.pdf" \
            -F "bank=bca")
          echo "Parse BCA: $STATUS"
          cat /tmp/response.json | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d.get('transactions',[])) > 0, 'No transactions'; print(f'OK: {len(d[\"transactions\"])} txns')"
          [ "$STATUS" = "200" ] || exit 1

      - name: Parse Mandiri
        run: |
          curl -sL "https://raw.githubusercontent.com/DIRJEN-BOT/docai/main/fixtures/demo_mandiri_statement.pdf" -o /tmp/mandiri.pdf
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "https://docaiid.pythonanywhere.com/parse" \
            -H "X-API-Key: docai-dev-key-12345" \
            -F "file=@/tmp/mandiri.pdf" \
            -F "bank=mandiri")
          echo "Parse Mandiri: $STATUS"
          cat /tmp/response.json | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d.get('transactions',[])) > 0, 'No transactions'; print(f'OK: {len(d[\"transactions\"])} txns')"
          [ "$STATUS" = "200" ] || exit 1

      - name: Verify income
        run: |
          curl -sL "https://raw.githubusercontent.com/DIRJEN-BOT/docai/main/fixtures/demo_bca_statement.pdf" -o /tmp/bca.pdf
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "https://docaiid.pythonanywhere.com/verify-income" \
            -H "X-API-Key: docai-dev-key-12345" \
            -F "file=@/tmp/bca.pdf" \
            -F "bank=bca")
          echo "Verify income: $STATUS"
          cat /tmp/response.json | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('verification_score', 0) > 0, 'No score'; print(f'Score={d[\"verification_score\"]}')"
          [ "$STATUS" = "200" ] || exit 1
